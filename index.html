  $('closeImageViewerBtn').addEventListener('click', () => $('imageViewerModal').classList.remove('active'));
  $('imageViewerModal').addEventListener('click', (e) => {
    if (e.target.id === 'imageViewerModal') $('imageViewerModal').classList.remove('active');
  });

  function formatVoiceTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function initVoicePlayers(container) {
    container.querySelectorAll('.voice-msg').forEach((wrap) => {
      const audio = wrap.querySelector('.voice-audio-el');
      const btn = wrap.querySelector('.voice-play-btn');
      const bar = wrap.querySelector('.voice-bar');
      const fill = wrap.querySelector('.voice-bar-fill');
      const handle = wrap.querySelector('.voice-bar-handle');
      const timeEl = wrap.querySelector('.voice-time');
      if (!audio || audio.dataset.wired) return;
      audio.dataset.wired = '1';

      const setProgress = (ratio) => {
        const pct = Math.max(0, Math.min(1, ratio)) * 100;
        fill.style.width = pct + '%';
        handle.style.left = pct + '%';
      };

      audio.addEventListener('loadedmetadata', () => {
        if (isFinite(audio.duration)) timeEl.textContent = formatVoiceTime(audio.duration);
      });
      audio.addEventListener('timeupdate', () => {
        if (audio.duration) setProgress(audio.currentTime / audio.duration);
        timeEl.textContent = formatVoiceTime(audio.paused && audio.currentTime === 0 ? audio.duration : audio.currentTime);
      });
      audio.addEventListener('play', () => { btn.innerHTML = SVG_PAUSE; });
      audio.addEventListener('pause', () => { btn.innerHTML = SVG_PLAY; });
      audio.addEventListener('ended', () => {
        btn.innerHTML = SVG_PLAY;
        setProgress(0);
        if (isFinite(audio.duration)) timeEl.textContent = formatVoiceTime(audio.duration);
      });

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.voice-audio-el').forEach((a) => { if (a !== audio && !a.paused) a.pause(); });
        if (audio.paused) audio.play().catch(() => {}); else audio.pause();
      });

      bar.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!audio.duration) return;
        const rect = bar.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        audio.currentTime = Math.max(0, Math.min(1, ratio)) * audio.duration;
        setProgress(ratio);
      });
    });
  }

  function renderReactionsInto(elem, reactions, msgId) {
    elem.innerHTML = '';
    Object.entries(reactions).forEach(([emoji, users]) => {
      const userKeys = Object.keys(users || {});
      if (userKeys.length === 0) return;
      const mine = userKeys.includes(myKey);
      const chip = document.createElement('span');
      chip.className = 'reaction-chip' + (mine ? ' mine' : '');
      chip.textContent = emoji + ' ' + userKeys.length;
      chip.onclick = (e) => { e.stopPropagation(); toggleReaction(msgId, emoji); };
      elem.appendChild(chip);
    });
  }

  async function toggleReaction(msgId, emoji) {
    const m = currentMessagesCache[msgId];
    const already = m && m.reactions && m.reactions[emoji] && m.reactions[emoji][myKey];
    const path = 'chats/' + currentChatId + '/messages/' + msgId + '/reactions/' + emoji + '/' + myKey;
    try {
      if (already) await remove(ref(db, path));
      else await set(ref(db, path), true);
    } catch (e) { showToast(t('sendFailedToast'), 'error'); }
  }

  async function togglePin(msgId) {
    try {
      const newVal = currentPinnedId === msgId ? null : msgId;
      await set(ref(db, 'chats/' + currentChatId + '/pinnedMessageId'), newVal);
    } catch (e) { showToast(t('sendFailedToast'), 'error'); }
  }

  $('unpinBtn').addEventListener('click', () => togglePin(currentPinnedId));
  $('pinnedBar').addEventListener('click', (e) => {
    if (e.target.id === 'unpinBtn') return;
    if (currentPinnedId) jumpToMessage(currentPinnedId);
  });

  function startReply(id, senderKey, previewText) {
    const snippet = (previewText || '').slice(0, 80);
    replyingToMsg = { id, senderKey, preview: snippet };
    $('replyPreviewName').textContent = senderKey === myKey ? t('youLabel') : currentPartnerName;
    $('replyPreviewSnippet').textContent = snippet;
    $('replyPreviewBar').classList.add('active');
    $('messageInput').focus();
  }

  function clearReply() {
    replyingToMsg = null;
    $('replyPreviewBar').classList.remove('active');
  }

  $('cancelReplyBtn').addEventListener('click', clearReply);

  // Recomputes both sides' chat-list preview (lastText/lastTs) from whatever the
  // real last message is now. Needed after deleting or editing a message so the
  // list doesn't keep showing text that no longer matches what's in the chat.
  async function syncChatListPreview() {
    if (!currentChatId || !currentPartnerKey) return;
    try {
      const q = query(ref(db, 'chats/' + currentChatId + '/messages'), orderByChild('timestamp'), limitToLast(1));
      const snap = await get(q);
      const now = Date.now();
      if (!snap.exists()) {
        await update(ref(db, 'userChats/' + myKey + '/' + currentPartnerKey), { lastText: '', lastTs: now }).catch(() => {});
        await update(ref(db, 'userChats/' + currentPartnerKey + '/' + myKey), { lastText: '', lastTs: now }).catch(() => {});
        return;
      }
      const [[, m]] = Object.entries(snap.val());
      let preview;
      if (m.type === 'image') preview = t('photoPreview');
      else if (m.type === 'voice') preview = m.fileName ? t('audioFile') : '🎤';
      else preview = await decryptText(currentPartnerKey, m);

      const senderIsMe = m.sender === myKey;
      const myText = senderIsMe ? (t('youPrefix') + preview) : preview;
      const otherText = senderIsMe ? preview : (t('youPrefix') + preview);

      await update(ref(db, 'userChats/' + myKey + '/' + currentPartnerKey), { lastText: myText, lastTs: m.timestamp, displayName: currentPartnerName }).catch(() => {});
      await update(ref(db, 'userChats/' + currentPartnerKey + '/' + myKey), { lastText: otherText, lastTs: m.timestamp, displayName: myDisplayName }).catch(() => {});
    } catch (e) { /* best-effort — list will self-correct next time a message is sent */ }
  }

  function startEditMessage(div, id, currentText) {
    div.classList.add('editing');
    const body = div.querySelector('.msg-body');
    const original = body.innerHTML;
    body.innerHTML = `<textarea rows="2">${escapeHtml(currentText)}</textarea>`;
    const ta = body.querySelector('textarea');
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    const finish = async (save) => {
      div.classList.remove('editing');
      if (save) {
        const newText = ta.value.trim();
        if (newText && newText !== currentText) {
          try {
            const enc = await encryptText(currentPartnerKey, newText);
            await update(ref(db, 'chats/' + currentChatId + '/messages/' + id), {
              text: enc.ct, iv: enc.iv, plain: enc.plain, edited: true
            });
            await syncChatListPreview();
          } catch (e) { showToast(t('sendFailedToast'), 'error'); }
          return;
        }
      }
      body.innerHTML = original;
    };
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') finish(false);
    });
    ta.addEventListener('blur', () => finish(true));
  }

  async function retryMessage(id, m) {
    if (!navigator.onLine) { showToast(t('sendFailedToast'), 'error'); return; }
    try {
      const partnerStatusSnap = await get(ref(db, 'status/' + currentPartnerKey));
      const partnerState = partnerStatusSnap.val();
      const newStatus = (partnerState && partnerState.state === 'online') ? 'delivered' : 'sent';
      await update(ref(db, 'chats/' + currentChatId + '/messages/' + id), { status: newStatus });

      const previewText = m.type === 'image' ? t('photoPreview') : (currentMessagesCache[id]?.decryptedText || '');
      const now = Date.now();
      update(ref(db, 'userChats/' + myKey + '/' + currentPartnerKey), { lastText: t('youPrefix') + previewText, lastTs: now, displayName: currentPartnerName }).catch(() => {});
      const partnerChatRef = ref(db, 'userChats/' + currentPartnerKey + '/' + myKey);
      const partnerChatSnap = await get(partnerChatRef);
      const prevUnread = (partnerChatSnap.exists() && partnerChatSnap.val().unreadCount) ? partnerChatSnap.val().unreadCount : 0;
      update(partnerChatRef, { lastText: previewText, lastTs: now, displayName: myDisplayName, unreadCount: prevUnread + 1 }).catch(() => {});
    } catch (e) { showToast(t('sendFailedToast'), 'error'); }
  }

  // ---- CHAT SEARCH ----
  $('chatSearchBtn').addEventListener('click', () => {
    chatSearchActive = !chatSearchActive;
    $('chatSearchBar').classList.toggle('active', chatSearchActive);
    if (chatSearchActive) { $('chatSearchInput').focus(); } else { clearChatSearchFilter(); }
  });
  $('chatSearchInput').addEventListener('input', debounce(applyChatSearchFilter, 150));

  function applyChatSearchFilter() {
    const q = $('chatSearchInput').value.trim().toLowerCase();
    const msgEls = document.querySelectorAll('#messages .msg');
    let matches = 0;
    msgEls.forEach(el => {
      if (!q) { el.classList.remove('search-hidden', 'search-match'); return; }
      const textEl = el.querySelector('.msg-text');
      const text = textEl ? textEl.textContent.toLowerCase() : '';
      const isMatch = text.includes(q);
      el.classList.toggle('search-hidden', !isMatch);
      el.classList.toggle('search-match', isMatch);
      if (isMatch) matches++;
    });
    $('chatSearchCount').textContent = q ? (matches > 0 ? t('matchesFound')(matches) : t('noMatches')) : '';
  }
  function clearChatSearchFilter() {
    document.querySelectorAll('#messages .msg').forEach(el => el.classList.remove('search-hidden', 'search-match'));
    $('chatSearchCount').textContent = '';
  }

  // ---- EXPORT CHAT ----
  $('exportChatBtn').addEventListener('click', () => {
    const entries = Object.entries(currentMessagesCache).sort((a, b) => a[1].timestamp - b[1].timestamp);
    if (entries.length === 0) return;
    const lines = entries.map(([id, m]) => {
      const who = m.sender === myKey ? myDisplayName : currentPartnerName;
      const when = new Date(m.timestamp).toLocaleString();
      let body = m.type === 'image' ? t('photoPreview') : (m.type === 'voice' ? '[voice message]' : (m.decryptedText || ''));
      return `[${when}] ${who}: ${body}`;
    });
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `chat-${currentPartnerName}-${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(t('exportDone'), 'success');
  });

  $('backBtn').addEventListener('click', () => {
    closeChatSubs();
    currentChatId = null;
    currentPartnerKey = null;
    currentPartnerName = null;
    showScreen('list');
  });

  $('sendBtn').addEventListener('click', (e) => {
    e.preventDefault();
    sendMessage();
  });
  
  $('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { 
      e.preventDefault(); 
      sendMessage(); 
      return;
    }
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); applyFormat('**'); }
    else if (mod && e.key.toLowerCase() === 'i') { e.preventDefault(); applyFormat('_'); }
    else if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); applyFormat('`'); }
    else if (mod && e.shiftKey && e.key.toLowerCase() === 'x') { e.preventDefault(); applyFormat('~~'); }
  });

  // ---- FORMATTING TOOLBAR ----
  $('fmtBoldBtn').addEventListener('click', () => applyFormat('**'));
  $('fmtItalicBtn').addEventListener('click', () => applyFormat('_'));
  $('fmtCodeBtn').addEventListener('click', () => applyFormat('`'));
  $('fmtStrikeBtn').addEventListener('click', () => applyFormat('~~'));

  $('messageInput').addEventListener('input', () => {
    if (!currentChatId) return;
    if ($('messageInput').value.trim().length > 0) {
      set(ref(db, 'chats/' + currentChatId + '/typing/' + myKey), Date.now()).catch(() => {});
      if (typingClearTimeout) clearTimeout(typingClearTimeout);
      typingClearTimeout = setTimeout(() => {
        set(ref(db, 'chats/' + currentChatId + '/typing/' + myKey), null).catch(() => {});
        typingClearTimeout = null;
      }, 2500);
    } else {
      if (typingClearTimeout) { clearTimeout(typingClearTimeout); typingClearTimeout = null; }
      set(ref(db, 'chats/' + currentChatId + '/typing/' + myKey), null).catch(() => {});
    }
  });

  // ---- FILE / IMAGE HANDLING (max 3MB, MIME-validated) ----
  $('photoBtn').addEventListener('click', () => {
    $('fileInput').click();
  });

  function isLikelyImageDataUrl(dataUrl) {
    return /^data:image\/(png|jpeg|jpg|gif|webp);base64,/.test(dataUrl);
  }
  function isLikelyAudioDataUrl(dataUrl) {
    return /^data:audio\//.test(dataUrl);
  }

  $('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const isImage = file.type && file.type.startsWith('image/');
    const isAudio = file.type && file.type.startsWith('audio/');
    if (!isImage && !isAudio) {
      showToast(t('errFileLarge'), 'error');
      $('fileInput').value = '';
      return;
    }
    if (file.size > 3 * 1024 * 1024) {
      showToast(t('errFileLarge'), 'error');
      $('fileInput').value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = async (uploadEvent) => {
      const dataUrl = uploadEvent.target.result;
      if (isImage) {
        if (!isLikelyImageDataUrl(dataUrl)) { showToast(t('errFileLarge'), 'error'); $('fileInput').value = ''; return; }
        await sendImageMessage(dataUrl);
      } else {
        if (!isLikelyAudioDataUrl(dataUrl)) { showToast(t('errFileLarge'), 'error'); $('fileInput').value = ''; return; }
        await sendVoiceMessage(dataUrl, file.name);
      }
      $('fileInput').value = '';
    };
    reader.onerror = () => showToast(t('loadFailedToast'), 'error');
    reader.readAsDataURL(file);
  });

  async function sendImageMessage(imageUrl) {
    if (isSending || !currentChatId) return;
    isSending = true;
    const now = Date.now();
    const replyPayload = replyingToMsg ? { id: replyingToMsg.id, senderKey: replyingToMsg.senderKey, preview: replyingToMsg.preview } : null;
    clearReply();

    try {
      if (!navigator.onLine) {
        await push(ref(db, 'chats/' + currentChatId + '/messages'), {
          sender: myKey, timestamp: now, type: 'image', imageUrl, status: 'error',
          ...(replyPayload ? { replyTo: replyPayload } : {})
        });
        showToast(t('sendFailedToast'), 'error');
        return;
      }

      const partnerStatusSnap = await get(ref(db, 'status/' + currentPartnerKey));
      const partnerState = partnerStatusSnap.val();
      const initialStatus = (partnerState && partnerState.state === 'online') ? 'delivered' : 'sent';

      await push(ref(db, 'chats/' + currentChatId + '/messages'), {
        sender: myKey, timestamp: now, type: 'image', imageUrl, status: initialStatus,
        ...(replyPayload ? { replyTo: replyPayload } : {})
      });

      await update(ref(db, 'userChats/' + myKey + '/' + currentPartnerKey), {
        lastText: t('youPrefix') + t('photoPreview'), lastTs: now, displayName: currentPartnerName
      });

      const partnerChatRef = ref(db, 'userChats/' + currentPartnerKey + '/' + myKey);
      const partnerChatSnap = await get(partnerChatRef);
      const prevUnread = (partnerChatSnap.exists() && partnerChatSnap.val().unreadCount) ? partnerChatSnap.val().unreadCount : 0;

      await update(partnerChatRef, {
        lastText: t('photoPreview'), lastTs: now, displayName: myDisplayName, unreadCount: prevUnread + 1
      });
    } catch (e) {
      showToast(t('sendFailedToast'), 'error');
    } finally {
      isSending = false;
    }
  }

  // ---- VOICE MESSAGES ----
  function formatRecTime(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  $('micBtn').addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { showToast(t('voiceUnsupported'), 'error'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(tr => tr.stop());
        clearInterval(recTimerInterval);
        $('recordingBar').classList.remove('active');
        $('micBtn').classList.remove('recording');
        if (recordedChunks.length === 0) return;
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        if (blob.size > 3 * 1024 * 1024) { showToast(t('errFileLarge'), 'error'); return; }
        const reader = new FileReader();
        reader.onload = async (ev) => { await sendVoiceMessage(ev.target.result); };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      recStartTs = Date.now();
      $('recordingBar').classList.add('active');
      $('micBtn').classList.add('recording');
      recTimerInterval = setInterval(() => {
        $('recTimer').textContent = formatRecTime(Math.floor((Date.now() - recStartTs) / 1000));
      }, 500);
    } catch (e) {
      showToast(t('micDenied'), 'error');
    }
  });

  $('cancelRecBtn').addEventListener('click', () => {
    recordedChunks = [];
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  });

  async function sendVoiceMessage(audioUrl, fileName) {
    if (isSending || !currentChatId) return;
    isSending = true;
    const now = Date.now();
    const replyPayload = replyingToMsg ? { id: replyingToMsg.id, senderKey: replyingToMsg.senderKey, preview: replyingToMsg.preview } : null;
    clearReply();
    const previewIcon = fileName ? t('audioFile') : '🎤';
    try {
      const partnerStatusSnap = await get(ref(db, 'status/' + currentPartnerKey));
      const partnerState = partnerStatusSnap.val();
      const initialStatus = (partnerState && partnerState.state === 'online') ? 'delivered' : 'sent';

      await push(ref(db, 'chats/' + currentChatId + '/messages'), {
        sender: myKey, timestamp: now, type: 'voice', audioUrl, status: initialStatus,
        ...(fileName ? { fileName } : {}),
        ...(replyPayload ? { replyTo: replyPayload } : {})
      });
      await update(ref(db, 'userChats/' + myKey + '/' + currentPartnerKey), {
        lastText: t('youPrefix') + previewIcon, lastTs: now, displayName: currentPartnerName
      });
      const partnerChatRef = ref(db, 'userChats/' + currentPartnerKey + '/' + myKey);
      const partnerChatSnap = await get(partnerChatRef);
      const prevUnread = (partnerChatSnap.exists() && partnerChatSnap.val().unreadCount) ? partnerChatSnap.val().unreadCount : 0;
      await update(partnerChatRef, { lastText: previewIcon, lastTs: now, displayName: myDisplayName, unreadCount: prevUnread + 1 });
    } catch (e) {
      showToast(t('sendFailedToast'), 'error');
    } finally {
      isSending = false;
    }
  }

  // ---- EMOJI PICKER ----
  $('emojiPicker').innerHTML = EMOJI_PICKER_LIST.map(em => `<span>${em}</span>`).join('');
  $('emojiPicker').addEventListener('click', (e) => {
    if (e.target.tagName !== 'SPAN') return;
    const input = $('messageInput');
    input.value += e.target.textContent;
    input.focus();
  });
  $('emojiBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    $('emojiPicker').classList.toggle('active');
  });
  document.addEventListener('click', (e) => {
    if (!$('emojiPicker').contains(e.target) && e.target.id !== 'emojiBtn') $('emojiPicker').classList.remove('active');
  });

  // ---- GIF / STICKER PICKER (GIPHY) ----
  // Uses GIPHY's public demo API key. It's rate-limited and meant for
  // exactly this kind of small/non-commercial project — swap in your own
  // key at https://developers.giphy.com if you outgrow it.
  const GIPHY_API_KEY = 'dc6zaTOxFJmzC';
  let gifTab = 'gifs';
  let gifSearchDebounceH = null;

  async function loadGifs(tab, searchTerm) {
    const grid = $('gifGrid');
    grid.innerHTML = `<div class="gif-loading">…</div>`;
    const type = tab === 'stickers' ? 'stickers' : 'gifs';
    const endpoint = searchTerm
      ? `https://api.giphy.com/v1/${type}/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(searchTerm)}&limit=24&rating=pg-13`
      : `https://api.giphy.com/v1/${type}/trending?api_key=${GIPHY_API_KEY}&limit=24&rating=pg-13`;
    try {
      const resp = await fetch(endpoint);
      const data = await resp.json();
      const items = data.data || [];
      if (items.length === 0) { grid.innerHTML = `<div class="gif-empty">No results</div>`; return; }
      grid.innerHTML = items.map(it => {
        const previewUrl = (it.images.fixed_width_small || it.images.fixed_width || it.images.original).url;
        const fullUrl = (it.images.original || it.images.fixed_width).url;
        return `<img src="${previewUrl}" data-full="${fullUrl}" loading="lazy" alt="" />`;
      }).join('');
    } catch (e) {
      grid.innerHTML = `<div class="gif-empty">${t('linkPreviewFailed')}</div>`;
    }
  }

  $('gifBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const wasActive = $('gifPicker').classList.contains('active');
    $('gifPicker').classList.toggle('active');
    $('emojiPicker').classList.remove('active');
    if (!wasActive && $('gifGrid').children.length === 0) loadGifs(gifTab, '');
  });
  document.addEventListener('click', (e) => {
    if (!$('gifPicker').contains(e.target) && e.target.id !== 'gifBtn') $('gifPicker').classList.remove('active');
  });
  document.querySelectorAll('.gif-tab').forEach(tabBtn => {
    tabBtn.addEventListener('click', () => {
      document.querySelectorAll('.gif-tab').forEach(b => b.classList.remove('active'));
      tabBtn.classList.add('active');
      gifTab = tabBtn.dataset.gifTab;
      loadGifs(gifTab, $('gifSearchInput').value.trim());
    });
  });
  $('gifSearchInput').addEventListener('input', () => {
    clearTimeout(gifSearchDebounceH);
    gifSearchDebounceH = setTimeout(() => loadGifs(gifTab, $('gifSearchInput').value.trim()), 350);
  });
  $('gifGrid').addEventListener('click', async (e) => {
    const img = e.target.closest('img[data-full]');
    if (!img) return;
    $('gifPicker').classList.remove('active');
    await sendImageMessage(img.dataset.full);
  });

  // ---- REACTION SHEET (bottom sheet: quick row + "more" grid) ----
  let reactionSheetMsgId = null;
  $('reactionSheetRow').innerHTML =
    REACTION_EMOJIS.map(em => `<span data-emoji="${em}">${em}</span>`).join('') +
    `<span class="reaction-more-btn" id="reactionMoreBtn" title="${t('moreEmoji')}">+</span>`;
  $('reactionSheetGrid').innerHTML = EMOJI_PICKER_LIST.map(em => `<span data-emoji="${em}">${em}</span>`).join('');

  function openReactionSheet(msgId) {
    reactionSheetMsgId = msgId;
    $('reactionSheetGrid').classList.remove('active');
    $('reactionSheetBackdrop').classList.add('active');
    $('reactionSheet').classList.add('active');
  }
  function closeReactionSheet() {
    reactionSheetMsgId = null;
    $('reactionSheetBackdrop').classList.remove('active');
    $('reactionSheet').classList.remove('active');
    $('reactionSheetGrid').classList.remove('active');
  }
  $('reactionSheetRow').addEventListener('click', (e) => {
    if (e.target.id === 'reactionMoreBtn') {
      $('reactionSheetGrid').classList.toggle('active');
      return;
    }
    const emoji = e.target.dataset.emoji;
    if (!emoji || !reactionSheetMsgId) return;
    toggleReaction(reactionSheetMsgId, emoji);
    closeReactionSheet();
  });
  $('reactionSheetGrid').addEventListener('click', (e) => {
    const emoji = e.target.dataset.emoji;
    if (!emoji || !reactionSheetMsgId) return;
    toggleReaction(reactionSheetMsgId, emoji);
    closeReactionSheet();
  });
  $('reactionSheetBackdrop').addEventListener('click', closeReactionSheet);

  async function sendMessage() {
    if (isSending) return;
    const text = $('messageInput').value.trim();
    if (!text || !currentChatId) return;

    isSending = true;
    $('messageInput').value = '';
    const now = Date.now();
    const partnerKeyAtSend = currentPartnerKey;
    const replyPayload = replyingToMsg ? { id: replyingToMsg.id, senderKey: replyingToMsg.senderKey, preview: replyingToMsg.preview } : null;
    clearReply();
    if (typingClearTimeout) { clearTimeout(typingClearTimeout); typingClearTimeout = null; }
    if (currentChatId) set(ref(db, 'chats/' + currentChatId + '/typing/' + myKey), null).catch(() => {});

    try {
      const enc = await encryptText(partnerKeyAtSend, text);

      if (!navigator.onLine) {
        await push(ref(db, 'chats/' + currentChatId + '/messages'), {
          text: enc.ct, iv: enc.iv, plain: enc.plain, sender: myKey, timestamp: now, type: 'text', status: 'error',
          ...(replyPayload ? { replyTo: replyPayload } : {})
        });
        showToast(t('sendFailedToast'), 'error');
        return;
      }

      const partnerStatusSnap = await get(ref(db, 'status/' + currentPartnerKey));
      const partnerState = partnerStatusSnap.val();
      const initialStatus = (partnerState && partnerState.state === 'online') ? 'delivered' : 'sent';

      await push(ref(db, 'chats/' + currentChatId + '/messages'), {
        text: enc.ct, iv: enc.iv, plain: enc.plain, sender: myKey, timestamp: now, type: 'text', status: initialStatus,
        ...(replyPayload ? { replyTo: replyPayload } : {})
      });

      await update(ref(db, 'userChats/' + myKey + '/' + currentPartnerKey), {
        lastText: t('youPrefix') + text, lastTs: now, displayName: currentPartnerName
      });

      const partnerChatRef = ref(db, 'userChats/' + currentPartnerKey + '/' + myKey);
      const partnerChatSnap = await get(partnerChatRef);
      const prevUnread = (partnerChatSnap.exists() && partnerChatSnap.val().unreadCount) ? partnerChatSnap.val().unreadCount : 0;

      await update(partnerChatRef, {
        lastText: text, lastTs: now, displayName: myDisplayName, unreadCount: prevUnread + 1
      });
    } catch (e) {
      showToast(t('sendFailedToast'), 'error');
    } finally {
      isSending = false;
    }
  }

  $('settingsBtn').addEventListener('click', () => {
    $('editDisplayName').value = myDisplayName;
    $('settingsAvatarPreview').innerHTML = avatarInnerHtml(myDisplayName, myAvatarUrl);
    $('settingsModal').classList.add('active');
  });
  $('closeSettingsBtn').addEventListener('click', () => $('settingsModal').classList.remove('active'));

  // ---- REAL AVATAR UPLOAD WITH ZOOM/CROP ----
  $('changeAvatarBtn').addEventListener('click', () => $('avatarFileInput').click());

  let cropState = { scale: 1, minScale: 1, x: 0, y: 0, naturalW: 0, naturalH: 0 };
  const CROP_SIZE = 240;

  $('avatarFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    $('avatarFileInput').value = '';
    if (!file || !file.type.startsWith('image/')) return;
    if (file.size > 8 * 1024 * 1024) { showToast(t('errFileLarge'), 'error'); return; }

    const reader = new FileReader();
    reader.onload = (ev) => {
      const cropImg = $('cropImg');
      cropImg.onload = () => {
        cropState.naturalW = cropImg.naturalWidth;
        cropState.naturalH = cropImg.naturalHeight;
        cropState.minScale = CROP_SIZE / Math.min(cropState.naturalW, cropState.naturalH);
        cropState.scale = cropState.minScale;
        cropState.x = (CROP_SIZE - cropState.naturalW * cropState.scale) / 2;
        cropState.y = (CROP_SIZE - cropState.naturalH * cropState.scale) / 2;
        $('cropZoom').value = 100;
        applyCropTransform();
        $('avatarCropModal').classList.add('active');
      };
      cropImg.src = ev.target.result;
    };
    reader.onerror = () => showToast(t('loadFailedToast'), 'error');
    reader.readAsDataURL(file);
  });

  function applyCropTransform() {
    const img = $('cropImg');
    img.style.width = (cropState.naturalW * cropState.scale) + 'px';
    img.style.height = (cropState.naturalH * cropState.scale) + 'px';
    img.style.transform = `translate(${cropState.x}px, ${cropState.y}px)`;
  }
  function clampCropOffset() {
    const w = cropState.naturalW * cropState.scale;
    const h = cropState.naturalH * cropState.scale;
    cropState.x = Math.min(0, Math.max(CROP_SIZE - w, cropState.x));
    cropState.y = Math.min(0, Math.max(CROP_SIZE - h, cropState.y));
  }

  $('cropZoom').addEventListener('input', () => {
    const centerImgX = (CROP_SIZE / 2 - cropState.x) / cropState.scale;
    const centerImgY = (CROP_SIZE / 2 - cropState.y) / cropState.scale;
    const factor = $('cropZoom').value / 100;
    cropState.scale = cropState.minScale * factor;
    cropState.x = CROP_SIZE / 2 - centerImgX * cropState.scale;
    cropState.y = CROP_SIZE / 2 - centerImgY * cropState.scale;
    clampCropOffset();
    applyCropTransform();
  });

  (function setupCropDrag() {
    const viewport = $('cropViewport');
    let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
    const down = (clientX, clientY) => {
      dragging = true; startX = clientX; startY = clientY;
      origX = cropState.x; origY = cropState.y;
      viewport.classList.add('dragging');
    };
    const move = (clientX, clientY) => {
      if (!dragging) return;
      cropState.x = origX + (clientX - startX);
      cropState.y = origY + (clientY - startY);
      clampCropOffset();
      applyCropTransform();
    };
    const up = () => { dragging = false; viewport.classList.remove('dragging'); };

    viewport.addEventListener('mousedown', (e) => { e.preventDefault(); down(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
    window.addEventListener('mouseup', up);

    viewport.addEventListener('touchstart', (e) => { const tt = e.touches[0]; down(tt.clientX, tt.clientY); }, { passive: true });
    viewport.addEventListener('touchmove', (e) => { const tt = e.touches[0]; move(tt.clientX, tt.clientY); }, { passive: true });
    viewport.addEventListener('touchend', up);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const cur = parseInt($('cropZoom').value, 10);
      $('cropZoom').value = Math.max(100, Math.min(300, cur - e.deltaY / 4));
      $('cropZoom').dispatchEvent(new Event('input'));
    }, { passive: false });
  })();

  $('cropCancelBtn').addEventListener('click', () => $('avatarCropModal').classList.remove('active'));

  $('cropSaveBtn').addEventListener('click', async () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 200;
      const ctx = canvas.getContext('2d');
      const outScale = 200 / CROP_SIZE;
      ctx.drawImage(
        $('cropImg'),
        0, 0, cropState.naturalW, cropState.naturalH,
        cropState.x * outScale, cropState.y * outScale,
        cropState.naturalW * cropState.scale * outScale, cropState.naturalH * cropState.scale * outScale
      );
      const resized = canvas.toDataURL('image/jpeg', 0.85);

      await update(ref(db, 'users/' + myKey), { avatarUrl: resized });
      myAvatarUrl = resized;
      const savedSession = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
      savedSession.avatarUrl = resized;
      localStorage.setItem(SESSION_KEY, JSON.stringify(savedSession));
      $('settingsAvatarPreview').innerHTML = avatarInnerHtml(myDisplayName, myAvatarUrl);
      renderList();
      $('avatarCropModal').classList.remove('active');
      showToast(t('nameUpdated'), 'success');
    } catch (err) {
      showToast(t('loadFailedToast'), 'error');
    }
  });

  // ---- RELOAD WITHOUT LOGGING OUT (session persists in localStorage across reloads) ----
  $('reloadBtn').addEventListener('click', () => location.reload());

  $('saveSettingsBtn').addEventListener('click', async () => {
    const newName = $('editDisplayName').value.trim();
    if (newName) {
      try {
        await update(ref(db, 'users/' + myKey), { displayName: newName });
        myDisplayName = newName;
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
        saved.displayName = newName;
        localStorage.setItem(SESSION_KEY, JSON.stringify(saved));
        showToast(t('nameUpdated'), 'success');
        $('settingsModal').classList.remove('active');
      } catch (e) {
        showToast(t('loadFailedToast'), 'error');
      }
    }
  });

  $('deleteAccountBtn').addEventListener('click', async () => {
    const ok = await genericConfirm(t('confirmDeleteAcc'));
    if (ok) {
      try {
        await remove(ref(db, 'users/' + myKey));
        await remove(ref(db, 'userChats/' + myKey));
        localStorage.clear();
        location.reload();
      } catch (e) {
        showToast(t('loadFailedToast'), 'error');
      }
    }
  });

  $('themeBtn').addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });
</script>

</body>
</html>
